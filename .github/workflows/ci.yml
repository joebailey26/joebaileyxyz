name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: ESLint, script: lint:scripts }
          - { name: Stylelint, script: lint:styles }
          - { name: Typecheck, script: typecheck }
          - { name: Contact tests, script: 'test:contact' }
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.check.script }}

  cms-build:
    name: CMS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: cms/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The editor shell and Worker bundle; runtime and WordPress tests live in joebailey26/static-wordpress.
      - run: pnpm run build
      - run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run
