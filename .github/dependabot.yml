version: 2

# @joebailey26 and @galexia-agency packages come from GitHub Packages. Dependabot can't use the
# workflow GITHUB_TOKEN, so it reads a read:packages token from the PACKAGES_TOKEN Dependabot secret.
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.PACKAGES_TOKEN }}

updates:
  - package-ecosystem: npm
    directories: ["/", "/cms"]
    registries:
      - github-packages
    schedule:
      interval: weekly
    # Patches come in one PR a week; minor and major updates get a PR each.
    groups:
      # FontAwesome's packages only work at the same major version, so they move together.
      fontawesome:
        patterns:
          - '@fortawesome/*'
      patch:
        update-types:
          - patch
        # Dependabot treats update-types as more specific than patterns, so without this the patch
        # group claims FontAwesome and its major updates fall back to one PR per package.
        exclude-patterns:
          - '@fortawesome/*'
    # Our own packages are updated by hand, alongside the changes that need them.
    ignore:
      - dependency-name: '@joebailey26/*'
      - dependency-name: '@galexia-agency/*'
      - dependency-name: eslint-config-galexia
      - dependency-name: stylelint-config-galexia
      - dependency-name: nuxt-component-*
      # Node's types follow the Node major in .nvmrc, so they're bumped by hand alongside it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
